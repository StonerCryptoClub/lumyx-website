    <style>
        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: 'Montserrat', 'Inter', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        .case-study-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0;
            position: relative;
        }
        
        /* Smooth gradient background */
        .case-study-container::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(255, 107, 0, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(30, 144, 255, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 107, 0, 0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        .case-study-hero {
            position: relative;
            padding: 4rem 2rem 5rem;
            min-height: 50vh;
            display: flex;
            align-items: center;
            overflow: hidden;
            background-color: #0a0a0f;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .case-study-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(10, 10, 15, 0.85) 0%, rgba(10, 10, 15, 0.7) 50%, rgba(10, 10, 15, 0.85) 100%);
            pointer-events: none;
            z-index: 1;
        }
        
        .case-study-hero.has-image::before {
            background: linear-gradient(135deg, rgba(10, 10, 15, 0.92) 0%, rgba(10, 10, 15, 0.75) 50%, rgba(10, 10, 15, 0.92) 100%);
        }

        .hero-content {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 3rem;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.875rem;
        }

        .breadcrumb a {
            color: #ff6b00;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .breadcrumb a:hover {
            color: #ff9500;
        }

        .category {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1.25rem;
            background: rgba(255, 107, 0, 0.15);
            color: #ff6b00;
            border-radius: 30px;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .case-study-title {
            font-size: 4.5rem;
            font-weight: 800;
            margin: 0 0 2rem 0;
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        .case-study-meta {
            display: flex;
            gap: 3rem;
            margin-bottom: 3rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .meta-item i {
            color: #ff6b00;
            font-size: 1.25rem;
        }

        .case-study-excerpt {
            font-size: 1.5rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
            max-width: 800px;
            margin: 0;
            font-weight: 400;
            position: relative;
            padding-left: 2rem;
            border-left: 3px solid rgba(255, 107, 0, 0.3);
        }

        /* Featured Image Section - Hidden, image is now hero background */
        .featured-image-section {
            display: none;
        }

        .content-section {
            max-width: 900px;
            margin: 4rem auto;
            padding: 0 2rem;
            position: relative;
        }

        .rich-text-content {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .rich-text-content h2 {
            font-size: 2rem;
            margin: 3rem 0 1.25rem;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid rgba(255, 107, 0, 0.3);
        }

        .rich-text-content h2::before {
            content: '';
            width: 4px;
            height: 100%;
            min-height: 2rem;
            background: linear-gradient(180deg, #ff6b00, #ff9500);
            border-radius: 2px;
        }

        .rich-text-content h3 {
            font-size: 1.5rem;
            margin: 2.5rem 0 1rem;
            color: #ffffff;
            font-weight: 600;
            position: relative;
        }

        .rich-text-content p {
            margin-bottom: 1.5rem;
            max-width: 75ch;
            color: rgba(255, 255, 255, 0.85);
        }

        .rich-text-content ul,
        .rich-text-content ol {
            margin: 1.5rem 0;
            padding-left: 0;
            max-width: 70ch;
            list-style: none;
        }

        .rich-text-content li {
            margin-bottom: 0.75rem;
            position: relative;
            padding-left: 2rem;
            color: rgba(255, 255, 255, 0.85);
        }

        .rich-text-content li::before {
            content: '✓';
            position: absolute;
            left: 0;
            top: 0;
            color: #ff6b00;
            font-weight: bold;
        }

        .results-section {
            background: transparent;
            padding: 4rem 2rem;
            margin: 4rem 0;
            position: relative;
            overflow: hidden;
        }

        .results-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .results-section h2 {
            font-size: 3.5rem;
            margin: 0 0 4rem 0;
            color: #ffffff;
            text-align: center;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .result-card {
            background: linear-gradient(145deg, rgba(30, 30, 40, 0.95), rgba(20, 20, 25, 0.98));
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem 1.5rem;
            border: 1px solid rgba(255, 107, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 160px;
            position: relative;
            overflow: hidden;
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff6b00, #ff9500);
            border-radius: 20px 20px 0 0;
        }
        
        .result-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(255, 107, 0, 0.12) 0%, transparent 60%);
            pointer-events: none;
        }

        .result-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 50px rgba(255, 107, 0, 0.15), 0 0 0 1px rgba(255, 107, 0, 0.3);
            border-color: rgba(255, 107, 0, 0.4);
        }

        .result-value {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #ff6b00, #ff9500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .result-label {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            line-height: 1.4;
            margin: 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }

        .loading-state, 
        .error-state {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .loading-state i, 
        .error-state i {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            color: #ff6b00;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: #ff6b00;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            margin-top: 2rem;
        }

        .btn:hover {
            background: #ff9500;
            transform: translateY(-2px);
        }

        @media (max-width: 1024px) {
            .case-study-title {
                font-size: 3.5rem;
            }

            .case-study-excerpt {
                font-size: 1.25rem;
            }

            .results-section {
                padding: 6rem 2rem;
                margin: 6rem 0;
            }
        }

        @media (max-width: 768px) {
            .case-study-hero {
                padding: 6rem 1.5rem 4rem;
                min-height: 60vh;
            }

            .case-study-title {
                font-size: 2.75rem;
            }

            .case-study-meta {
                flex-direction: column;
                gap: 1rem;
            }

            .content-section {
                margin: 4rem auto;
                padding: 0 1.5rem;
            }

            .rich-text-content h2 {
                font-size: 2rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .rich-text-content h2::after {
                width: 100%;
                height: 1px;
            }

            .rich-text-content p,
            .rich-text-content ul,
            .rich-text-content ol {
                max-width: 100%;
            }

            .results-section {
                padding: 4rem 1.5rem;
                margin: 4rem 0;
            }

            .results-section h2 {
                font-size: 2.5rem;
                margin-bottom: 3rem;
            }

            .result-card {
                padding: 2rem;
                min-height: 180px;
            }

            .result-value {
                font-size: 3rem;
            }

            .result-label {
                font-size: 1.125rem;
            }
        }
    </style>

    <script>
        // Placeholder case studies with full demo content
        const placeholderCaseStudies = {
            'test-project-website-redesign': {
                fields: {
                    title: 'E-Commerce Website Redesign',
                    category: 'Web Development',
                    clientName: 'Fashion Retailer',
                    projectDate: '2024-01-15',
                    excerpt: 'A complete website overhaul that improved user experience and conversion rates by 150%. We redesigned the entire customer journey from landing page to checkout.',
                    content: `
                        <h2>Project Overview</h2>
                        <p>Our client, a growing fashion retailer, came to us with a website that was outdated and underperforming. Their conversion rate was below industry average and customers frequently abandoned their carts due to a confusing checkout process.</p>
                        
                        <h2>The Challenge</h2>
                        <p>The existing website had several critical issues:</p>
                        <ul>
                            <li>Slow page load times averaging 6+ seconds</li>
                            <li>Non-responsive design that performed poorly on mobile</li>
                            <li>Complex 5-step checkout process</li>
                            <li>Poor product discovery and navigation</li>
                        </ul>
                        
                        <h2>Our Approach</h2>
                        <p>We implemented a comprehensive redesign strategy focused on user experience and performance optimization. Our team conducted extensive user research, created detailed wireframes, and built a modern, mobile-first design system.</p>
                        
                        <h2>Key Results</h2>
                    `,
                    results: '150% increase in conversions<br>40% faster load times<br>95% user satisfaction rate<br>6-month project'
                }
            },
            'meta-ads-scaling': {
                fields: {
                    title: 'Meta Ads Scaling Success',
                    category: 'Ad Campaigns',
                    clientName: 'E-commerce Brand',
                    projectDate: '2024-02-20',
                    excerpt: 'Scaled ad campaigns across Meta platforms achieving 350% ROAS and 2.5x customer acquisition rate through strategic audience targeting and creative optimization.',
                    content: `
                        <h2>Project Overview</h2>
                        <p>An established e-commerce brand approached us to scale their Meta advertising while maintaining profitability. They had hit a plateau and needed expert guidance to break through to the next level.</p>
                        
                        <h2>The Challenge</h2>
                        <p>The client faced several obstacles:</p>
                        <ul>
                            <li>Ad fatigue with existing creative assets</li>
                            <li>Rising cost per acquisition</li>
                            <li>Difficulty scaling beyond $50k/month spend</li>
                            <li>Limited audience expansion opportunities</li>
                        </ul>
                        
                        <h2>Our Approach</h2>
                        <p>We developed a comprehensive scaling strategy that included creative refresh cycles, advanced audience segmentation, and automated bid optimization. Our team implemented a rigorous testing framework to identify winning combinations.</p>
                        
                        <h2>Key Results</h2>
                    `,
                    results: '350% ROAS improvement<br>2.5x customer acquisition rate<br>40% reduction in CPA<br>12-month ongoing campaign'
                }
            },
            'tiktok-growth': {
                fields: {
                    title: 'TikTok Viral Growth Strategy',
                    category: 'Social Media',
                    clientName: 'Lifestyle Brand',
                    projectDate: '2024-03-10',
                    excerpt: 'Innovative TikTok content strategy that grew the account from 0 to 100K followers in 60 days with 2.5M organic views and a 45% engagement rate.',
                    content: `
                        <h2>Project Overview</h2>
                        <p>A lifestyle brand wanted to establish a strong presence on TikTok to reach Gen Z consumers. Starting from zero, they needed a strategy that would generate rapid, organic growth.</p>
                        
                        <h2>The Challenge</h2>
                        <p>Building a TikTok presence from scratch presented unique challenges:</p>
                        <ul>
                            <li>No existing audience or content library</li>
                            <li>Highly competitive lifestyle niche</li>
                            <li>Need for authentic, platform-native content</li>
                            <li>Limited internal video production capabilities</li>
                        </ul>
                        
                        <h2>Our Approach</h2>
                        <p>We created a content strategy built around trending sounds, relatable scenarios, and authentic storytelling. Our team produced a content calendar with daily posts optimized for peak engagement times.</p>
                        
                        <h2>Key Results</h2>
                    `,
                    results: '100K followers in 60 days<br>2.5M organic views<br>45% engagement rate<br>3-month campaign'
                }
            }
        };

        // Direct fetch approach (same as blog) for proper image loading
        async function fetchCaseStudyBySlug(slug) {
            console.log('🔍 Fetching case study by slug:', slug);
            
            try {
                const response = await fetch(
                    `https://cdn.contentful.com/spaces/${window.config.contentful.spaceId}/entries?content_type=caseStudies&fields.slug=${slug}&access_token=${window.config.contentful.accessToken}&include=10`
                );
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('📊 Contentful response:', data);
                
                if (data.items && data.items.length > 0) {
                    const study = data.items[0];
                    
                    // Process featured image if available (same as blog)
                    if (study.fields.featuredImage && data.includes?.Asset) {
                        const asset = data.includes.Asset.find(a => a.sys.id === study.fields.featuredImage.sys.id);
                        if (asset) {
                            study.fields.featuredImage = {
                                fields: {
                                    file: {
                                        url: asset.fields.file.url
                                    }
                                }
                            };
                            console.log('✅ Resolved featuredImage:', asset.fields.file.url);
                        }
                    }
                    
                    // Also check for thumbnail field
                    if (study.fields.thumbnail && data.includes?.Asset) {
                        const asset = data.includes.Asset.find(a => a.sys.id === study.fields.thumbnail.sys.id);
                        if (asset) {
                            study.fields.thumbnail = {
                                fields: {
                                    file: {
                                        url: asset.fields.file.url
                                    }
                                }
                            };
                            console.log('✅ Resolved thumbnail:', asset.fields.file.url);
                        }
                    }
                    
                    return study;
                }
                
                // If not found in Contentful, return placeholder
                console.log('⚠️ Not found in Contentful, checking placeholders...');
                if (placeholderCaseStudies[slug]) {
                    console.log('✅ Found placeholder case study');
                    return placeholderCaseStudies[slug];
                }
                
                return null;
            } catch (error) {
                console.error('❌ Error fetching case study:', error);
                // On error, try placeholder
                if (placeholderCaseStudies[slug]) {
                    return placeholderCaseStudies[slug];
                }
                throw error;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // Get the slug from URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');
            
            if (!slug) {
                showError('No case study specified');
                return;
            }
            
            try {
                // Wait for config to be ready
                await new Promise(resolve => setTimeout(resolve, 100));
                
                // Get the case study data using direct fetch (like blog)
                const caseStudy = await fetchCaseStudyBySlug(slug);
                
                if (!caseStudy || !caseStudy.fields) {
                    showError('Case study not found');
                    return;
                }
                
                // Display the case study data
                displayCaseStudy(caseStudy);
                
            } catch (error) {
                console.error('Error loading case study:', error);
                showError('Failed to load case study');
            }
        });
        
        // Function to display case study data
        function displayCaseStudy(caseStudy) {
            const fields = caseStudy.fields || {};
            
            // Update breadcrumb
            document.getElementById('case-study-title-breadcrumb').textContent = fields.title || 'Case Study';
            
            // Update category
            document.getElementById('case-study-category').textContent = fields.category || 'Case Study';
            
            // Update title
            document.getElementById('case-study-title').textContent = fields.title || 'Untitled Case Study';
            
            // Update meta information
            document.getElementById('case-study-client').textContent = `Client: ${fields.clientName || 'Confidential'}`;
            
            // Handle both date and projectDate fields
            const dateValue = fields.date || fields.projectDate;
            document.getElementById('case-study-date').textContent = dateValue ? formatDate(dateValue) : 'Recent Project';
            
            // Update excerpt
            document.getElementById('case-study-excerpt').textContent = fields.excerpt || fields.description || '';
            
            // Update content
            const contentElement = document.getElementById('case-study-content');
            
            // Parse results - handle string with <br> tags or array
            let resultsHTML = '';
            if (fields.results) {
                let resultItems = [];
                if (typeof fields.results === 'string') {
                    resultItems = fields.results.split('<br>').map(r => r.trim()).filter(r => r);
                } else if (Array.isArray(fields.results)) {
                    resultItems = fields.results;
                }
                
                if (resultItems.length > 0) {
                    resultsHTML = `
                        <div class="results-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem; margin-top: 1.5rem;">
                            ${resultItems.map(result => {
                                // Extract number/percentage from result
                                const numberMatch = result.match(/^([\d.]+[%x]?|\d+[%x]?)/);
                                const metric = numberMatch ? numberMatch[0] : '';
                                const label = result.replace(metric, '').trim();
                                
                                return `
                                    <div class="result-card" style="background: linear-gradient(145deg, rgba(30, 30, 40, 0.95), rgba(20, 20, 25, 0.98)); border: 1px solid rgba(255, 107, 0, 0.2); border-radius: 16px; padding: 1.5rem 1.25rem; text-align: center; position: relative; overflow: hidden;">
                                        <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #ff6b00, #ff9500);"></div>
                                        <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at 50% 0%, rgba(255, 107, 0, 0.1) 0%, transparent 60%); pointer-events: none;"></div>
                                        <div style="font-size: 2.25rem; font-weight: 800; background: linear-gradient(135deg, #ff6b00, #ff9500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 0.4rem; position: relative; z-index: 1;">${metric || '✓'}</div>
                                        <div style="font-size: 0.85rem; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; position: relative; z-index: 1;">${label || result}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                }
            }
            
            // Check if we have rich HTML content (from placeholder) or Contentful rich text
            if (fields.content && typeof fields.content === 'string' && fields.content.includes('<')) {
                // It's HTML content from placeholder - render directly + add results
                contentElement.innerHTML = fields.content + resultsHTML;
            } else if (fields.content && fields.content.content) {
                // It's Contentful rich text - render it
                contentElement.innerHTML = renderRichText(fields.content) + resultsHTML;
            } else {
                // Fallback content
                contentElement.innerHTML = `
                    <h2>Project Overview</h2>
                    <p>${fields.excerpt || fields.description || 'This case study showcases our strategic approach and the exceptional results we achieved for our client.'}</p>
                    
                    <h2>The Challenge</h2>
                    <p>Our client approached us with specific goals to improve their ${fields.category?.toLowerCase() || 'business'} performance and drive measurable results.</p>
                    
                    <h2>Our Approach</h2>
                    <p>We implemented a comprehensive, data-driven strategy tailored to our client's unique needs and market position. Our team utilized industry-leading tools and methodologies to optimize performance across all touchpoints.</p>
                    
                    <h2>Key Results</h2>
                    ${resultsHTML || '<p>Results exceeded client expectations across all key performance indicators.</p>'}
                `;
            }
            
            // Set featured image as hero background
            const heroSection = document.querySelector('.case-study-hero');
            
            // Get image URL - check featuredImage first, then thumbnail
            const imageUrl = fields.featuredImage?.fields?.file?.url
                ? 'https:' + fields.featuredImage.fields.file.url
                : fields.thumbnail?.fields?.file?.url
                    ? 'https:' + fields.thumbnail.fields.file.url
                    : null;
            
            console.log('📸 Image URL:', imageUrl);
            
            if (imageUrl) {
                heroSection.style.backgroundImage = `url(${imageUrl})`;
                heroSection.classList.add('has-image');
            }
            
            // Update page title
            document.title = `${fields.title || 'Case Study'} | Lumyx Consulting`;
        }
        
        // Function to show error message
        function showError(message) {
            document.getElementById('case-study-category').textContent = 'Error';
            document.getElementById('case-study-title').textContent = message || 'An error occurred';
            document.getElementById('case-study-excerpt').textContent = 'Please try again or contact us for assistance.';
            document.getElementById('case-study-content').innerHTML = `
                <p>We couldn't load the requested case study. Please try one of these options:</p>
                <ul>
                    <li>Go back to the <a href="./index.html#portfolio">portfolio page</a></li>
                    <li>Try refreshing the page</li>
                    <li><a href="./contact.html">Contact us</a> for assistance</li>
                </ul>
            `;
        }
        
        // Function to format date
        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            if (isNaN(date)) return '';
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }
        
        // Function to render rich text content
        function renderRichText(content) {
            if (!content || !content.content) return '';
            
            return content.content.map(node => {
                if (node.nodeType === 'paragraph') {
                    return `<p>${node.content.map(text => text.value).join('')}</p>`;
                }
                if (node.nodeType === 'heading-1') {
                    return `<h1>${node.content.map(text => text.value).join('')}</h1>`;
                }
                if (node.nodeType === 'heading-2') {
                    return `<h2>${node.content.map(text => text.value).join('')}</h2>`;
                }
                if (node.nodeType === 'heading-3') {
                    return `<h3>${node.content.map(text => text.value).join('')}</h3>`;
                }
                if (node.nodeType === 'unordered-list') {
                    return `<ul>${node.content.map(item => `<li>${item.content.map(p => p.content.map(text => text.value).join('')).join('')}</li>`).join('')}</ul>`;
                }
                if (node.nodeType === 'ordered-list') {
                    return `<ol>${node.content.map(item => `<li>${item.content.map(p => p.content.map(text => text.value).join('')).join('')}</li>`).join('')}</ol>`;
                }
                if (node.nodeType === 'hyperlink') {
                    return `<a href="${node.data.uri}">${node.content.map(text => text.value).join('')}</a>`;
                }
                if (node.nodeType === 'hr') {
                    return '<hr>';
                }
                return '';
            }).join('');
        }
    </script>
</body>
